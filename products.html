<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNow — Products</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">ShopNow</h1>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html" class="active">Products</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main>
    <section class="page-intro">
      <h2>All products</h2>
      <p>Browse our full range of electronics and accessories.</p>
    </section>

    <section class="catalogue-controls">
      <input type="search" id="search-box" placeholder="Search products...">
      <div class="category-filters">
        <button class="category-btn active" data-category="All">All</button>
        <button class="category-btn" data-category="Computers">Computers</button>
        <button class="category-btn" data-category="Phones">Phones</button>
        <button class="category-btn" data-category="Audio">Audio</button>
        <button class="category-btn" data-category="Accessories">Accessories</button>
        <button class="category-btn" data-category="Wearables">Wearables</button>
      </div>
      <select id="sort-select">
        <option value="default">Sort by: Featured</option>
        <option value="low-high">Price: Low to High</option>
        <option value="high-low">Price: High to Low</option>
      </select>
      <p id="result-count"></p>
    </section>

    <div id="product-list" class="product-grid"></div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 ShopNow. All rights reserved.</p>
  </footer>
  <script src="js/app.js"></script>
</body>
</html>
