<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNow — Cart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">ShopNow</h1>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
      <a href="cart.html" class="active">Cart (<span id="cart-count">0</span>)</a>
      <span id="auth-nav-slot"><a href="login.html">Login</a></span>
    </nav>
  </header>

  <main>
    <section class="page-intro">
      <h2>Your Cart</h2>
      <p>Items stay in your cart even if you refresh or close the page.</p>
    </section>

    <section class="cart">
      <div id="cart-items"></div>
      <div class="cart-summary" id="cart-summary">
        <p>Subtotal: <strong>AED <span id="subtotal">0.00</span></strong></p>
        <button id="checkout-btn" class="btn">Proceed to Checkout</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 ShopNow. All rights reserved.</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart-page.js"></script>
</body>
</html>
