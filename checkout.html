<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNow — Checkout</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">ShopNow</h1>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
      <a href="cart.html" class="active">Cart (<span id="cart-count">0</span>)</a>
      <span id="auth-nav-slot"><a href="login.html">Login</a></span>
    </nav>
  </header>

  <main>
    <section class="page-intro">
      <h2>Checkout</h2>
      <p id="checkout-user">Checking your login...</p>
    </section>

    <section class="checkout-layout">
      <form id="checkout-form" class="checkout-form" novalidate>
        <h3>Shipping information</h3>
        <label for="name">Full name</label>
        <input type="text" id="name">
        <label for="address">Delivery address</label>
        <textarea id="address" rows="3"></textarea>
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" placeholder="+971 50 123 4567">
        <p class="note">Payment is simulated in this lab: placing the order works as if payment succeeded.</p>
        <button type="submit" id="place-order" class="btn">Place Order</button>
      </form>

      <aside class="order-summary">
        <h3>Order summary</h3>
        <div id="checkout-summary"></div>
      </aside>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 ShopNow. All rights reserved.</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
