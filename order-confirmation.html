<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNow — Order Confirmed</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">ShopNow</h1>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
      <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
      <span id="auth-nav-slot"><a href="login.html">Login</a></span>
    </nav>
  </header>

  <main>
    <section class="confirmation">
      <div class="confirm-icon">&#10003;</div>
      <h2>Thank you, your order has been placed!</h2>
      <p>Order number: <strong>#<span id="order-number"></span></strong></p>
      <p id="order-meta"></p>
      <div id="items" class="confirm-items"><p>Loading your order...</p></div>
      <p class="confirm-total">Total: <strong>AED <span id="order-total">0.00</span></strong></p>
      <a href="products.html" class="btn">Continue shopping</a>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 ShopNow. All rights reserved.</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/order-confirmation.js"></script>
</body>
</html>
